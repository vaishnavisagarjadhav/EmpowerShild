name: empowershield
description: "EmpowerShield - Women Safety and Emergency Response System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  provider: ^6.1.2

  # Networking
  http: ^1.2.2

  # Location & Maps
  geolocator: ^13.0.1
  google_maps_flutter: ^2.9.0

  # Sensors (accelerometer/gyroscope) for fall detection
  sensors_plus: ^6.1.1

  # Audio recording (evidence + scream/voice distress capture)
  record: ^5.1.2
  camera: ^0.11.0+2

  # Speech-to-text for distress keyword detection
  speech_to_text: ^7.0.0

  # On-device offline AI inference
  tflite_flutter: ^0.11.0

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3

  # Local/offline SMS fallback when no network
  telephony: ^0.2.0

  # Permissions
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
